<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230"/>
      <stop offset="100%" stop-color="#11131a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#2e3547" stroke-width="2"/>

  <!-- Vault Shield Outer -->
  <path d="M64 22 L96 34 C96 64 82 86 64 98 C46 86 32 64 32 34 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Vault Circular Dial -->
  <circle cx="64" cy="56" r="18" fill="#1e2230" stroke="#475569" stroke-width="3"/>
  <circle cx="64" cy="56" r="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Keyhole Lock Core -->
  <circle cx="64" cy="52" r="4.5" fill="url(#metalGrad)"/>
  <path d="M61.5 54 L66.5 54 L68 64 L60 64 Z" fill="url(#metalGrad)"/>

  <!-- Glowing indicator notch -->
  <circle cx="64" cy="40" r="2" fill="#38bdf8"/>
  <circle cx="78" cy="62" r="1.5" fill="#818cf8"/>
  <circle cx="50" cy="62" r="1.5" fill="#818cf8"/>
</svg>
